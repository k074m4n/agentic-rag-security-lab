[project]
name = "agentic-rag-security-lab"
version = "0.1.0"
description = "A deliberately attackable multi-agent RAG codebase assistant (smolagents) for studying prompt injection, RAG poisoning and excessive agency."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Yiğit Kotaman" },
    { name = "Alperen Tekin" },
]
requires-python = ">=3.11,<3.14"
dependencies = [
    # Security floors:
    # - smolagents >= 1.25: remote-executor fix; Gradio 6 compatibility landed in 1.26.
    # - gradio >= 6.20: CVE-2026-59806 (open redirect / SSRF in /gradio_api/file=).
    # - litellm: 1.82.7 and 1.82.8 were malicious uploads (TeamPCP, 2026-03-24).
    "smolagents[gradio,litellm]>=1.26.0",
    "gradio>=6.20.0",
    "litellm>=1.83.0,!=1.82.7,!=1.82.8",
    "loguru>=0.7.3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pip-audit>=2.9.0",
    "pytest>=8.0.0",
    "ruff>=0.14.0",
]

[tool.uv]
# Dependency cooldown: ignore releases younger than 7 days, so a compromised
# upload (like litellm 1.82.7/1.82.8) is usually yanked before we can resolve it.
exclude-newer = "7 days"
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
